name: build-apk

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - name: Customization guard
        run: |
          fail=0
          while IFS='|' read -r path pat desc; do
            case "$path" in ''|\#*) continue;; esac
            if grep -qF -- "$pat" "$path" 2>/dev/null; then
              echo "OK   $desc"
            else
              echo "::error::定制丢失：$desc ($path 里找不到 '$pat')"
              fail=$((fail+1))
            fi
          done < scripts/custom-inventory.txt
          [ "$fail" -eq 0 ] || { echo "共 $fail 项定制缺失，拒绝编译"; exit 1; }

      - name: Apply shell tool patch (optional)
        run: |
          if [ -f 0001-add-shell-tool.patch ] && git apply --check 0001-add-shell-tool.patch 2>/dev/null; then
            git apply --verbose 0001-add-shell-tool.patch
          else
            echo "no patch to apply (change is already in the tree)"
          fi

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable

      - name: Accept Android licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Install toolchain deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd file gpgv

      - name: Build runtime (arm64-v8a)
        run: bash runtime/build-runtime.sh arm64-v8a

      - name: Build APK
        run: DSH_BETA_TOKEN_FILE= bash tooling/build-apk.sh -f arm64

      - name: Show artifacts
        run: find app/build/app/outputs -name '*.apk' -exec ls -lh {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-go-apk-arm64
          path: app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 2
